services:
  app:
    image: ${FDE_IMAGE:-fde-portal:current}
    container_name: fde-portal
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3006:3006"
    volumes:
      - /opt/fde-portal/data:/app/.data
    environment:
      NODE_ENV: production
      FDE_DATA_DIR: /app/.data/workbench
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3006/fde/api/workbench/projects').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
