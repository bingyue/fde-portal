# Include within the existing HTTPS server block. Preserve all other locations.
location = /fde { return 308 /fde/workbench; }
location ^~ /fde/ {
    auth_basic "FDE Workbench";
    auth_basic_user_file /etc/nginx/.fde-portal.htpasswd;
    # Reject cross-origin API writes, including legacy configuration endpoints.
    set $fde_foreign_origin $http_origin;
    if ($http_origin = "$scheme://$http_host") { set $fde_foreign_origin ""; }
    if ($fde_foreign_origin != "") { return 403; }
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:3006;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_read_timeout 650s;
    proxy_send_timeout 650s;
    proxy_buffering off;
}
